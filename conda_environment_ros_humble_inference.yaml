name: umi-ros-humble
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # ROS 2 Humble's apt-installed Python bindings are built for Python 3.10.
  # Do not install rclpy from pip/conda; source /opt/ros/humble instead.
  - python=3.10
  - pip

  # PyTorch / CUDA. Keep this aligned with the original UMI environment.
  - pytorch=2.1.0
  - pytorch-cuda=12.1
  - torchvision=0.16.0

  # UMI / diffusion-policy runtime dependencies.
  - numpy=1.24
  - scipy=1.11
  - numba=0.57
  - pandas=2.1
  - py-opencv=4.7
  - matplotlib=3.7
  - av=10.0
  - pyyaml=6.0
  - tqdm=4.65
  - zarr=2.16
  - numcodecs=0.11
  - hydra-core=1.2.0
  - wandb=0.15.8
  - protobuf=4.25
  - dill=0.3.7
  - einops=0.6.1
  - diffusers=0.18.2
  - scikit-video=1.1
  - gym=0.21.0
  - llvm-openmp=14
  - python-lmdb=1.4
  - timm=0.9.7
  - scikit-fda=0.9
  - cython=0.29
  - accelerate=0.24
  - boto3=1.33
  - aiohttp=3.9
  - aiofiles=23.2
  - pip:
    - protobuf==4.25.8
    - huggingface-hub==0.25.2
    - ray[default]==2.8.0
    - threadpoolctl==3.2
    - v4l2py==2.2
    - atomics==1.0.2
    - pynput==1.7.6
    - fastcrc==0.2
    - imagecodecs==2023.9.18
    - robomimic==0.2.0
    - pyrealsense2
